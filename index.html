<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>PUZZLIAR Tools</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Hiragino Mincho ProN','Hiragino Mincho Pro','YuMincho','Yu Mincho','游明朝','Noto Serif JP',serif;
  background:#0a0a09;color:#f0ede6;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;
}
.title{font-size:clamp(24px,4vw,36px);font-weight:700;letter-spacing:.2em;color:#d4a04a;margin-bottom:8px}
.sub{font-size:12px;color:#b8b5ae;letter-spacing:.3em;margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;max-width:720px;width:100%}
.card{
  background:#141412;border:1.5px solid #b88a3e;border-radius:10px;
  padding:22px 24px;text-decoration:none;color:inherit;
  transition:.2s;display:flex;flex-direction:column;gap:8px;
}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(239,159,39,.25);background:#1e1e1c}
.card-title{font-size:18px;font-weight:700;color:#ef9f27;letter-spacing:.05em}
.card-desc{font-size:12px;color:#b8b5ae;line-height:1.6}
.footer{margin-top:36px;font-size:11px;color:#6a6864;text-align:center}
.footer a{color:#b88a3e;text-decoration:none}
</style>
</head>
<body>
<div class="title">PUZZLIAR TOOLS</div>
<div class="sub">運営ツール</div>
<div class="grid">
  <a class="card" href="amida/">
    <div class="card-title">削減アミダクジ</div>
    <div class="card-desc">集計ツール・発表ツール</div>
  </a>
  <a class="card" href="sugoroku/">
    <div class="card-title">制限すごろく</div>
    <div class="card-desc">集計ツール・発表ツール・ルール説明</div>
  </a>
  <a class="card" href="bingo/">
    <div class="card-title">強奪ビンゴ</div>
    <div class="card-desc">集計ツール・発表画面</div>
  </a>
</div>
<div class="footer">
  PUZZLIAR &nbsp;·&nbsp; <a href="https://puzzliar.jp">puzzliar.jp</a>
</div>
</body>
</html>
